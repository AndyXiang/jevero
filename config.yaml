# jevero configuration.
#
# Taxonomy, descriptions, and thresholds live here rather than in Python source.
# Secrets do NOT belong here; they come from the environment (.env).

model:
  provider: openrouter
  # Jev is a decision model, reached through OpenRouter's Decisions endpoint.
  # Pin the version: the `~typesafe/jev-latest` alias advertises no routable
  # endpoint (checked 2026-05), so requests against it can fail. Bump this
  # deliberately after re-running the validation set.
  name: "typesafe/jev-1.13"
  base_url: "https://openrouter.ai/api"
  timeout_seconds: 60.0

zotero:
  # The Zotero desktop local API. Reads need no credentials and no network.
  # It must be enabled in Zotero: Settings -> Advanced -> "Allow other
  # applications on this computer to communicate with Zotero".
  base_url: "http://127.0.0.1:23119/api"
  # Which collection to classify. Matched against the collection name, or
  # against a "Parent/Child" path when names repeat. List them with:
  #   jevero collections
  inbox_collection: "00 Inbox"
  timeout_seconds: 30.0
  # Writes need Zotero 10+ and a local API key that Zotero grants at runtime.
  # The first write shows a dialog: choose "Always Allow".

classification:
  # A missing abstract is not the same as an irrelevant paper. When false, such
  # papers are skipped and flagged for review. When true, title-only
  # classification runs and its results always carry
  # jevero/review/missing-abstract.
  allow_title_only: false

  # A paper says what framework it is built on in its introduction, and usually not
  # in its abstract, so an abstract-only judgement cannot see framework topics at
  # all. Two papers whose text names NRQCD scored that topic 0.50 and 0.54 from the
  # abstract and 0.86-0.92 once the first few thousand characters were added.
  # Zotero indexes PDF attachments itself, so this reads an indexed attachment --
  # there is no PDF parsing in this project.
  full_text:
    enabled: true
    # Characters of the indexed text, from the start; the introduction is where a
    # paper states its framework. Measured on this library: 8k, 10k and 20k give
    # the same judgements, while the median paper is 53k characters and the longest
    # 590k, against the model's 32k-token context. So the excerpt has to be bounded.
    max_chars: 10000

  # What belongs in this library at all. This is the evidence behind the
  # `irrelevant` coverage judgment, which is why it lives here rather than in a
  # prompt string in jev.py.
  scope: >
    The reader's research literature: perturbative QCD, effective field theories
    (NRQCD, pNRQCD, SCET), heavy-quark and quarkonium physics, energy
    correlators and energy-flow observables, transverse-momentum-dependent and
    fragmentation physics, jets and event shapes, chiral symmetry breaking, and
    closely related computational methods. Excluded: work with no plausible
    connection to QCD or collider physics, such as unrelated machine-learning
    methods, astrophysics, or pure mathematics.

# Topics answer one question: what is this paper about? They are grouped by
# axis only to keep the list honest - a topic must be a subject a reader would
# browse for, not a restatement of an axis that is already covered elsewhere.
#
# Deliberately absent, because they carried no information and rode along on top
# of the specific topics that imply them (measured on 29 papers: 0 applications
# each, while their stored tags had accumulated anyway):
#   perturbative-qcd        implied by nrqcd / pnrqcd / scet
#   collider-phenomenology  duplicates kind/phenomenology
#   experiment              duplicates kind/experiment
#   amplitudes, loop-integrals  no paper in the library rests on them
topics:
  # --- what the paper studies ---
  energy-correlator:
    description: >
      Energy-energy correlators, N-point energy correlators, energy-flow
      operators, and generalized detectors, together with the factorization,
      resummation, or measurement specific to those observables.

  fragmentation:
    description: >
      Fragmentation functions and hadron production through fragmentation:
      single- and dihadron fragmentation functions, their evolution and fits,
      fragmentation factorization, and the fragmentation contribution to
      quarkonium production.

  jet:
    description: >
      Jets and jet-like collider observables: jet production and jet algorithms,
      jet functions and jet substructure, grooming and tagging, and event-shape
      or thrust-like observables such as thrust, the C-parameter, and jet mass.

  quarkonium:
    description: >
      Production, decay, spectroscopy, or structure of heavy quarkonium.

  heavy-flavor:
    description: >
      Heavy-quark production, fragmentation, heavy-flavor hadrons, and related
      perturbative or nonperturbative physics.

  lattice-qcd:
    description: >
      Lattice gauge theory and lattice QCD: numerical simulation of QCD on a
      spacetime lattice, hadronic matrix elements and spectra, wave functions
      and structure of bound states, and other nonperturbative quantities
      obtained from the lattice.

  chiral-dynamics:
    description: >
      Spontaneous chiral symmetry breaking and its low-energy description:
      chiral Lagrangians and chiral perturbation theory, the pion and Goldstone
      sector, and the QCD vacuum and its condensates.

  # --- which framework or formalism the paper is built on ---
  tmd:
    description: >
      Transverse-momentum-dependent factorization: TMD parton distributions and
      TMD fragmentation functions, Collins-Soper evolution, rapidity
      divergences, and nonperturbative Sudakov resummation.

  nrqcd:
    description: >
      NRQCD factorization, matching, long-distance matrix elements,
      color-singlet and color-octet mechanisms.

  pnrqcd:
    description: >
      Potential NRQCD and quarkonium bound-state effective theory.

  scet:
    description: >
      Soft-collinear effective theory and the factorization or resummation built
      on it: jet, threshold, and endpoint factorization, rapidity
      renormalization, and soft functions.

# Words dropped from the vocabulary. Their tags are removed from the library on
# the next `process --apply` and never added back, so retiring a word cleans up
# after itself instead of leaving tags that no longer mean anything. This is also
# what tells a retired name apart from a name the reader typed by hand: only
# known names (these, plus the two lists above) are ever deleted or routed.
retired_topics:
  - perturbative-qcd        # implied by nrqcd / pnrqcd / scet
  - collider-phenomenology  # duplicated kind/phenomenology
  - experiment              # duplicated kind/experiment
  - amplitudes              # no paper in the library rests on it
  - loop-integrals          # no paper in the library rests on it

retired_kinds:
  - core                    # a project-relevance question; belongs to `projects`
  - review                  # renamed to `overview`: `review` is the human queue

# Whole namespaces that were renamed. Every tag under them is cleared on the next
# run, which is how the rename migrates the library instead of leaving the old
# names behind as tags the tool no longer recognises. Harmless to keep, and safe to
# drop once nothing carries them any more.
retired_prefixes:
  - "role/"
  - "agent/"
  - "jevero/"


# NOTE: a `projects` dimension (per-project usefulness) is designed but not
# implemented yet. See docs/projects-design.md before adding it back here.

# The kind dimension asks what sort of paper this is, independently of what it is
# about. Descriptions are classification guidance, so the mapping form is preferred.
kinds:
  theory:
    description: >
      Develops formal theory rather than a reusable tool: new effective field
      theories, formal structures, or conceptual frameworks whose value is
      understanding the physics.
  method:
    description: >
      Provides a technique, formalism, or computational method that can be
      applied to other problems.
  overview:
    description: >
      A review, lecture note, or pedagogical overview rather than new results.
      (Named ``overview`` because ``review`` is the tool's own human-review queue,
      not a genre.)
  phenomenology:
    description: >
      Connects theory to observable predictions or to experimental data.
  experiment:
    description: >
      An experimental measurement or detector-level analysis.
  reference:
    description: >
      Background, context, or a standard result worth keeping on hand, but not
      immediately actionable.

# Coverage states are not topics. They describe whether the taxonomy fits.
coverage:
  covered:
    description: >
      Both the paper's subject matter and the approach it is built on are
      represented by the configured topics. A specific technique, observable, or
      formalism variant that is not separately named does not break coverage, as
      long as its approach fits inside a listed topic.
  missing-topic:
    description: >
      The paper is within the intended literature scope, but the topic list
      leaves out something central to it: the area of physics it belongs to, or
      the framework it is built on. A reader browsing the topics would look for
      such a paper and not find where it belongs, even if one listed topic
      happens to match its observable. A gap of that size is a human decision,
      not something to invent here.
  irrelevant:
    description: >
      The paper is outside the intended literature scope and does not justify
      a new topic.

collections:
  # Collections are a projection of the tags: topic/<name> lands in
  # "<topics_parent>/<name>", kind/<name> in "<kinds_parent>/<name>", and every
  # jevero/review* paper lands in review_collection. Missing collections are
  # created (Zotero 10+ local API). Nothing is ever removed from a collection
  # except the inbox, and only when remove_from_inbox is on.
  # Preview with: jevero route --dry-run
  topics_parent: "02 Topics"
  kinds_parent: "03 Kinds"
  review_collection: "04 Review"
  route_kinds: true
  remove_from_inbox: true

thresholds:
  # Membership: is this word part of what the paper is? Calibrated into the empty
  # valley of the judgement distribution — measured over 319 topic judgements,
  # only 3 lie within +/-0.05 of 0.60, against 12 at the old 0.85 cut-off, while
  # run-to-run noise reaches 0.05. See docs/tag-system-design.md.
  apply_floor: 0.60
  # Guaranteed band: at or above this a topic is applied whatever the cap says, so
  # a paper with several headline topics can never lose one to a counting rule.
  # It only binds when a paper has more than topic_max of them (measured: no paper
  # in this library has more than two).
  topic_guaranteed: 0.95
  # Kinds get a stricter floor: "what sort of paper is this" hedges more than
  # topic membership, so with the shared floor one kind tag appeared in one run and
  # vanished in the next on the same configuration. 0.70 measured 0/29 churn.
  kind_floor: 0.70
  # Focus: how many qualifying words to keep, by rank. This is what makes adding
  # a word to the vocabulary unable to change an existing paper's tags.
  topic_max: 3
  kind_max: 2

  # Review band and coverage gates. Every jevero/review/... tag traces back to
  # exactly one of these comparisons.
  review: 0.55
  # Recalibrated after the question was rewritten (see docs/tag-system-design.md):
  # asked about "the paper's area of physics, or the framework it is built on",
  # the three papers known to be gaps score 0.63 / 0.71 / 0.84 while the highest
  # non-gap of 28 scores 0.33. 0.50 sits in that valley; anything from 0.40 to
  # 0.55 flags the same three today.
  missing_topic_review: 0.50
  irrelevant: 0.80
  # `covered` is the sensitive signal: that same paper falls from 0.96 to 0.59
  # without its topic. Measured distribution separates cleanly at 0.45 | 0.79.
  covered_apply: 0.70
