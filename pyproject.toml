[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevero"
version = "0.1.0"
description = "Minimal, auditable Zotero literature classifier powered by Jev."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
jevero = "jevero.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jevero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
