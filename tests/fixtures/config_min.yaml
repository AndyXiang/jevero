model:
  provider: openrouter
  name: "typesafe/jev-1.13"

zotero:
  base_url: "http://127.0.0.1:23119/api"
  inbox_collection: "00 Inbox"

classification:
  allow_title_only: false
  scope: "Test scope for unit tests."

topics:
  quarkonium:
    description: >
      Production, decay, spectroscopy, or structure of heavy quarkonium.
  nrqcd:
    description: >
      NRQCD factorization and long-distance matrix elements.

# Deliberately the bare-list form from the design docs, to prove it is accepted.
kinds:
  - core
  - method

coverage:
  - covered
  - missing-topic
  - irrelevant

thresholds:
  apply_floor: 0.60
  kind_floor: 0.70

  review: 0.55
  missing_topic_review: 0.70
  irrelevant: 0.80
  covered_apply: 0.70

# Mirrors the shipped config: the pre-fingerprint namespaces are being retired.
retired_prefixes:
  - "agent/"
